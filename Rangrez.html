/* Layout: one long scroll. A mandala draws itself in the hero, section headings get a henna squiggle, gallery cards redraw on hover. Admin lives at #admin. */
:root{--bg:#0d2520;--bg2:#153629;--card:#123027;--fg:#f5ead7;--muted:#b4b8a4;--gold:#ecb64f;--rose:#ee7692;--line:rgba(245,234,215,.18);--ink:#0d2520;--ok:#7ccf9b;--warn:#f0b35a;--bad:#f28b8b;

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.8rem 1.5rem;border-radius:999px;background:var(--gold);color:var(--ink);font:600 1rem var(--body);text-decoration:none;border:1px solid var(--gold);cursor:pointer;transition:transform .2s}

.banner{background:var(--rose);color:var(--ink);text-align:center;padding:8px 16px;font-weight:600;font-size:.95rem}

/* hero */
.hero{display:grid;gap:12px;align-items:center;padding-block:12px 56px}

.ink{fill:none;stroke:var(--gold);stroke-width:.9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0}

.card{margin:0}

.card:hover .ink,.card:focus-within .ink{animation:draw 1.4s ease both;animation-delay:calc(var(--i)*60ms)}

.steps{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));counter-reset:s;padding:0;margin:0;list-style:none}

.steps h3{font-size:1.4rem;margin-bottom:6px}
.steps p{color:var(--muted)}

/* reviews */
.rev{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.rev blockquote{margin:0;padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.rev cite{display:block;margin-top:12px;font-style:normal}

/* booking */
.book{display:grid;gap:32px}

input,select,textarea{width:100%;font:400 1rem var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:.7rem .85rem}

.sum div{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card)}
.sum b{display:block;font:400 2rem/1.1 var(--display)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px}
.tabs button{flex:none;font:500 .95rem var(--body);padding:.5rem 1rem;border-radius:999px;border:1px solid var(--line);background:none;color:var(--fg);cursor:pointer}

.panel{display:grid;gap:14px;max-width:760px}
.item{display:grid;gap:10px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.item .bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.danger{color:var(--bad);border-color:var(--bad)}
.pubbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;z-index:5}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font:500 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line)}
.sample{background:var(--bg2);border:1px dashed var(--gold);border-radius:12px;padding:12px 14px;font-size:.92rem}
.msg{color:var(--warn);font-size:.92rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hero .ink,.sq path{stroke-dashoffset:0}.hero .dot{opacity:1}.track{flex-wrap:wrap;width:auto}}
</style>

 h+='<section id="book"><div class="book"><div>'+head('Booking','Pick your date')+'<p>Tell us the date, the function and what you have in mind. The message opens in WhatsApp, ready to send. Dates in wedding season fill early, so ask a few weeks ahead.</p>'+(w||ig?'':'<p class="note" style="margin-top:12px">Contact details are not set yet.</p>')+'</div>'
 +'<form class="form" id="bookform" onsubmit="return false"><div class="row2"><div class="field"><label for="bk-name">Your name</label><input id="bk-name" autocomplete="name"></div><div class="field"><label for="bk-date">Date</label><input id="bk-date" type="date"></div></div>'
 +'<div class="field"><label for="bk-svc">Service</label><select id="bk-svc">'+S.services.map(function(s){return '<option>'+esc(s.name)+'</option>'}).join('')+'</select></div>'
 +'<div class="field"><label for="bk-msg">Details</label><textarea id="bk-msg" placeholder="Function, venue, how many people, design ideas"></textarea></div>'
 +'<a class="btn" id="bk-go" target="_blank" rel="noopener" href="#book">Send on WhatsApp</a></form></div></section></div>';
 h+='<footer><div class="wrap foot"><div><b style="font-family:var(--display);font-size:1.3rem">'+esc(B.name)+'</b>'+(B.about?'<p class="note" style="max-width:46ch">'+esc(B.about)+'</p>':'')+'</div><div style="display:flex;gap:18px;flex-wrap:wrap">'+(ig?'<a href="'+ig+'" target="_blank" rel="noopener">Instagram</a>':'')+(w?'<span>+'+esc(w)+'</span>':'')+'<a href="#admin">Studio login</a></div></div></footer>';
 return h}
function updateWA(){var a=document.getElementById('bk-go');if(!a)return;var v=function(id){return document.getElementById(id).value.trim()};
 var t='Hi '+S.brand.name+'! I would like to book '+v('bk-svc')+(v('bk-date')?' on '+v('bk-date'):'')+'.'+(v('bk-name')?' My name is '+v('bk-name')+'.':'')+(v('bk-msg')?' '+v('bk-msg'):'');
 var w=waNum(),ig=igUrl();
 if(w){a.href='https://wa.me/'+w+'?text='+encodeURIComponent(t);a.textContent='Send on WhatsApp';a.removeAttribute('aria-disabled')}
 else if(ig){a.href=ig;a.textContent='Message on Instagram';a.removeAttribute('aria-disabled')}
 else{a.href='#book';a.textContent='Contact not set yet';a.setAttribute('aria-disabled','true')}}

/* ---------- admin ---------- */
function canEdit(){return !!(USER&&USER.canEdit&&USER.canEdit())}
function inp(label,id,val,extra){return '<div class="field"><label for="'+id+'">'+label+'</label><input id="'+id+'" '+extra+' value="'+esc(val)+'"></div>'}
function bnd(k){return 'data-b="'+k+'"'}
function lst(l,i,k){return 'data-l="'+l+'" data-i="'+i+'" data-k="'+k+'"'}
function adminView(){var h='<div class="wrap adm"><header class="top"><a class="logo" href="#"><i></i>'+esc(S.brand.name)+'</a><a class="btn ghost sm" href="#">View site</a></header>';
 if(!canEdit()){return h+'<h1>Studio panel</h1><p class="note" style="max-width:52ch">This panel opens for the studio owner. Open this page while signed in to the Claude account that owns it, then come back to <b>#admin</b>.</p></div>'}
 var cnt={};STATUS.forEach(function(s){cnt[s]=0});S.enquiries.forEach(function(e){cnt[e.status]=(cnt[e.status]||0)+1});
 h+='<h1>Studio panel</h1><p class="note">Edit anything below, then press Publish to update the live site.</p>';
 h+='<div class="sum"><div><b>'+S.enquiries.length+'</b><span class="mono">Enquiries</span></div><div><b>'+cnt.New+'</b><span class="mono">New</span></div><div><b>'+cnt.Confirmed+'</b><span class="mono">Confirmed</span></div><div><b>'+S.services.length+'</b><span class="mono">Services</span></div></div>';
 h+='<div class="tabs" role="tablist">'+[['details','Details'],['services','Services'],['gallery','Designs'],['reviews','Reviews'],['enq','Enquiries']].map(function(t){return '<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(tab===t[0])+'">'+t[1]+'</button>'}).join('')+'</div>';
 var B=S.brand;
 if(tab==='details'){h+='<div class="panel">'+inp('Studio name','a-name',B.name,bnd('name'))+inp('Name in Hindi (optional)','a-script',B.script,bnd('script'))+inp('Tagline','a-tag',B.tagline,bnd('tagline'))+'<div class="field"><label for="a-sub">Short intro</label><textarea id="a-sub" '+bnd('sub')+'>'+esc(B.sub)+'</textarea></div>'+inp('City','a-city',B.city,bnd('city'))+'<div class="field"><label for="a-about">About (footer)</label><textarea id="a-about" '+bnd('about')+'>'+esc(B.about)+'</textarea></div>'+inp('WhatsApp number','a-wa',B.whatsapp,bnd('whatsapp')+' inputmode="tel" placeholder="9876543210"')+inp('Instagram handle','a-ig',B.instagram,bnd('instagram')+' placeholder="@yourhandle"')+inp('Top banner (leave empty to hide)','a-ann',B.announce,bnd('announce')+' placeholder="Diwali dates open, book now"')+'</div>'}
 if(tab==='services'){h+='<div class="panel"><div class="sample">The prices here are sample values. Replace them with your real rates before sharing the link.</div>'+S.services.map(function(s,i){return '<div class="item"><div class="bar"><span class="mono">Service '+(i+1)+'</span><button class="btn ghost sm danger" data-act="del" data-l="services" data-i="'+i+'">Remove</button></div>'+inp('Name','sv-n'+i,s.name,lst('services',i,'name'))+'<div class="row2">'+inp('Price (rupees)','sv-p'+i,s.price,lst('services',i,'price')+' inputmode="numeric"')+inp('Per','sv-u'+i,s.unit,lst('services',i,'unit'))+'</div><div class="field"><label for="sv-d'+i+'">Description</label><textarea id="sv-d'+i+'" '+lst('services',i,'desc')+'>'+esc(s.desc)+'</textarea></div></div>'}).join('')+'<button class="btn ghost" data-act="add-service">Add a service</button></div>'}
 if(tab==='gallery'){h+='<div class="panel"><p class="note">Drawn patterns appear on the site as animated henna art. Upload photos of your real work to show them next to the patterns.</p>'+S.gallery.map(function(g,i){return '<div class="item"><div class="bar"><span class="pill">'+(g.kind==='photo'?'Photo':esc(STYLES[g.style]||'Pattern'))+'</span><button class="btn ghost sm danger" data-act="del" data-l="gallery" data-i="'+i+'">Remove</button></div><div class="row2">'+inp('Title','g-t'+i,g.title,lst('gallery',i,'title'))+inp('Label','g-g'+i,g.tag,lst('gallery',i,'tag'))+'</div></div>'}).join('')+'<div class="item"><span class="mono">Add a pattern</span><div class="row2"><div class="field"><label for="n-style">Pattern</label><select id="n-style">'+Object.keys(STYLES).map(function(k){return '<option value="'+k+'">'+STYLES[k]+'</option>'}).join('')+'</select></div>'+inp('Title','n-title','','placeholder="Name this design"')+'</div><button class="btn ghost" data-act="add-motif">Add pattern</button></div><div class="item"><span class="mono">Upload a photo</span><input id="n-file" type="file" accept="image/*"><span class="note">Photos need the Editor role on this page.</span></div></div>'}
 if(tab==='reviews'){h+='<div class="panel"><p class="note">Add only feedback that clients really gave you. The Kind words section stays hidden while this list is empty.</p>'+S.reviews.map(function(r,i){return '<div class="item"><div class="bar"><span class="mono">Review '+(i+1)+'</span><button class="btn ghost sm danger" data-act="del" data-l="reviews" data-i="'+i+'">Remove</button></div>'+inp('Client name','r-n'+i,r.name,lst('reviews',i,'name'))+'<div class="field"><label for="r-t'+i+'">What they said</label><textarea id="r-t'+i+'" '+lst('reviews',i,'text')+'>'+esc(r.text)+'</textarea></div></div>'}).join('')+'<button class="btn ghost" data-act="add-review">Add a review</button></div>'}
 if(tab==='enq'){h+='<div class="panel"><p class="note">Messages arrive on WhatsApp. Log each one here to keep dates and status in one place.</p>'+S.enquiries.map(function(e,i){return '<div class="item"><div class="bar"><span class="pill">'+esc(e.status)+'</span><button class="btn ghost sm danger" data-act="del" data-l="enquiries" data-i="'+i+'">Remove</button></div><div class="row2">'+inp('Client','e-n'+i,e.name,lst('enquiries',i,'name'))+inp('Date','e-d'+i,e.date,lst('enquiries',i,'date')+' type="date"')+'</div><div class="row2"><div class="field"><label for="e-s'+i+'">Service</label><select id="e-s'+i+'" '+lst('enquiries',i,'service')+'>'+S.services.map(function(s){return '<option'+(s.name===e.service?' selected':'')+'>'+esc(s.name)+'</option>'}).join('')+'</select></div><div class="field"><label for="e-t'+i+'">Status</label><select id="e-t'+i+'" '+lst('enquiries',i,'status')+'>'+STATUS.map(function(s){return '<option'+(s===e.status?' selected':'')+'>'+s+'</option>'}).join('')+'</select></div></div>'+inp('Note','e-o'+i,e.note,lst('enquiries',i,'note'))+'</div>'}).join('')+'<button class="btn ghost" data-act="add-enq">Log an enquiry</button></div>'}
 h+='</div><div class="pubbar"><span id="pub-state" class="note">'+(dirty?'You have unpublished changes.':'Everything is published.')+(note?' <span class="msg">'+esc(note)+'</span>':'')+'</span><button class="btn" data-act="publish"'+(busy?' disabled':'')+'>Publish changes</button></div>';
 return h}

/* ---------- publishing ---------- */
var RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
function buildDoc(){var json=JSON.stringify(S).replace(/</g,'\\u003c');var link=document.querySelector('link[href*="fonts.googleapis"]').outerHTML;var css=document.getElementById('page-style').textContent;var main=document.getElementById('main').textContent;var T='<'+'/';
 return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+T+'style></head><body><title>'+esc(S.brand.name)+T+'title><meta name="claude:viewport-fit-sides" content="cover">'+link+'<style id="page-style">'+css+T+'style><div id="app"></div><script type="application/json" id="site-data">'+json+T+'script><script id="main">'+main+T+'script></body></html>'}
function publish(){if(busy)return;busy=true;note='Publishing...';render();
 var cu=window.claude&&window.claude.use?window.claude.use('artifact'):Promise.resolve(null);
 cu.then(function(a){if(!a){note='Publishing is not available in this view.';busy=false;render();return}
  return a.publish(buildDoc()).then(function(){dirty=false;note=''},function(err){busy=false;note=err&&err.code==='conflict'?'Someone else published first. The page reloads to their version.':(err&&err.code==='not_granted'||err&&err.code==='not_writer'?'You need edit access to publish.':'Could not publish. Try again.');render()})})
 .catch(function(){busy=false;note='Could not publish. Try again.';render()})}

/* ---------- wiring ---------- */
function isAdmin(){return location.hash==='#admin'}
function render(){var y=window.scrollY;app.innerHTML=isAdmin()?adminView():siteView();document.title=S.brand.name;
 if(!isAdmin()){updateWA();var io=window.IntersectionObserver?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.6}):null;document.querySelectorAll('.sq').forEach(function(el){io?io.observe(el):el.classList.add('in')})}
 if(isAdmin())window.scrollTo(0,y)}
function markDirty(){if(!dirty){dirty=true;var el=document.getElementById('pub-state');if(el)el.textContent='You have unpublished changes.'}}
document.addEventListener('input',function(e){var t=e.target;
 if(t.closest&&t.closest('#bookform')){updateWA();return}
 if(t.dataset&&t.dataset.l){S[t.dataset.l][+t.dataset.i][t.dataset.k]=t.value;markDirty();return}
 if(t.dataset&&t.dataset.b){S.brand[t.dataset.b]=t.value;markDirty()}});
document.addEventListener('change',function(e){var t=e.target;
 if(t.dataset&&t.dataset.l&&t.tagName==='SELECT'&&t.dataset.k==='status'){render()}
 if(t.id==='n-file'&&t.files&&t.files[0]){var file=t.files[0];note='Uploading photo...';render();
  (window.claude&&window.claude.use?window.claude.use('assets'):Promise.resolve(null)).then(function(as){if(!as){note='Photo upload needs the Editor role.';render();return}
   return as.upload(file).then(function(r){S.gallery.push({id:uid(),kind:'photo',url:r.url,title:file.name.replace(/\.[^.]+$/,''),tag:'Our work'});markDirty();note='';tab='gallery';render()},function(){note='Upload failed. Try a smaller photo.';render()})})}});
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-tab],[data-act]');if(!b)return;
 if(b.dataset.tab){tab=b.dataset.tab;note='';render();return}
 var a=b.dataset.act;
 if(a==='publish')publish();
 else if(a==='del'){S[b.dataset.l].splice(+b.dataset.i,1);markDirty();render()}
 else if(a==='add-service'){S.services.push({id:uid(),name:'New service',desc:'',price:'',unit:'per person'});markDirty();render()}
 else if(a==='add-motif'){var st=document.getElementById('n-style').value,ti=document.getElementById('n-title').value.trim();S.gallery.push({id:uid(),kind:'motif',style:st,title:ti||STYLES[st],tag:'New'});markDirty();render()}
 else if(a==='add-review'){S.reviews.push({id:uid(),name:'',text:''});markDirty();render()}
 else if(a==='add-enq'){S.enquiries.unshift({id:uid(),name:'',date:'',service:(S.services[0]||{}).name||'',status:'New',note:''});markDirty();render()}});
window.addEventListener('hashchange',function(){note='';render();if(!isAdmin()&&!location.hash)window.scrollTo(0,0)});
render();
if(window.claude&&window.claude.use){window.claude.use('user').then(function(u){USER=u;if(isAdmin())render()},function(){})}
})();
</script>

</body></html>
